spring.application.name=backend

# Conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/bibliogest?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=bibliogest_user
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true